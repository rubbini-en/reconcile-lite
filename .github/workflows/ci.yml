name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository; it needs no other token scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Same version as docker-compose.yml. The credentials are throwaway
        # values for a database that exists only for this job.
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: reconcile
          POSTGRES_PASSWORD: reconcile_local
          POSTGRES_DB: reconcile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcile -d reconcile_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://reconcile:reconcile_local@127.0.0.1:5432/reconcile_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
